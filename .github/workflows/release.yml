# Publication to PyPI.
#
# Publishing uses trusted publishing over OIDC. No long-lived token is stored in
# this repository, and none is ever passed to a step: PyPI verifies the workflow
# identity directly, so there is no credential that can leak from here.
#
# Three gates stand between a tag and a published release, and none of them is a
# reviewer's attention:
#
#   1. The tag must match the version in pyproject.toml. A tag that disagrees
#      with the package it claims to publish is a mistake, not a release.
#   2. The full gate runs first, and publication depends on it passing.
#   3. The `pypi` environment requires the owner's approval, and its deployment
#      branch policy admits only `v*` tags. A push to main cannot reach it.
#
# A version already on PyPI cannot be replaced. Deleting a release does not free
# its version number. That is why this refuses on a mismatch rather than
# resolving it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag matches the package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked
      - id: check
        name: Compare the tag against pyproject and the package
        run: |
          set -euo pipefail
          declared=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          imported=$(uv run python -c "import mintmark; print(mintmark.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag declared=$declared imported=$imported"
          if [ "$tag" != "$declared" ] || [ "$declared" != "$imported" ]; then
            echo "::error::tag $tag, pyproject $declared, package $imported. These must agree."
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src/
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python tools/mdlint.py .

  build:
    name: build and check the distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked
      - name: Build with the backend installed from uv.lock
        run: uv build --no-build-isolation
      - name: Generate the bill of materials
        run: uv run cyclonedx-py environment --of JSON -o dist/sbom.json
      - name: Confirm the built artifacts carry the tagged version
        run: |
          set -euo pipefail
          test -f "dist/mintmark-${{ needs.verify.outputs.version }}-py3-none-any.whl"
          test -f "dist/mintmark-${{ needs.verify.outputs.version }}.tar.gz"
      - name: Inspect the exact distributions that will be published
        run: uv run pytest tests/unit/test_packaging.py
      - name: Smoke-test the wheel in an isolated directory
        run: |
          set -euo pipefail
          wheel="$PWD/dist/mintmark-${{ needs.verify.outputs.version }}-py3-none-any.whl"
          smoke=$(mktemp -d)
          uv venv --python 3.12 "$smoke/venv"
          uv export --locked --no-dev --no-emit-project -o "$smoke/requirements.txt"
          uv pip install --python "$smoke/venv/bin/python" -r "$smoke/requirements.txt"
          uv pip install --python "$smoke/venv/bin/python" --no-deps "$wheel"
          cd "$smoke"
          "$smoke/venv/bin/mintmark" mint --pack example --recipe demo --seed 42 --out run
          "$smoke/venv/bin/mintmark" verify run
      - name: Scan built artifacts for private-corpus canary
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          MINTMARK_CANARY: ${{ secrets.MINTMARK_CANARY }}
        run: uv run python tools/canary.py dist/
      - name: Seal publishable bytes
        run: |
          cd dist
          sha256sum mintmark-*.whl mintmark-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          if-no-files-found: error
          path: |
            dist/mintmark-*.whl
            dist/mintmark-*.tar.gz
            dist/sbom.json
            dist/SHA256SUMS

  publish:
    name: publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The approval gate. Its deployment branch policy admits only `v*` tags.
    environment:
      name: pypi
      url: https://pypi.org/project/mintmark/${{ needs.verify.outputs.version }}/
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Verify the bytes approved by the build job
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Stage only distributions for PyPI
        run: |
          set -euo pipefail
          mkdir pypi-dist
          cp dist/mintmark-*.whl dist/mintmark-*.tar.gz pypi-dist/
          ls -1 pypi-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: pypi-dist/
          verify-metadata: true
      - name: Attest the release distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/mintmark-*.whl
            dist/mintmark-*.tar.gz
      - name: Publish the release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && {
            echo "::error::release $RELEASE_TAG already exists"
            exit 1
          }
          gh release create "$RELEASE_TAG" \
            dist/mintmark-*.whl \
            dist/mintmark-*.tar.gz \
            dist/sbom.json \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Mintmark $RELEASE_TAG" \
            --generate-notes
