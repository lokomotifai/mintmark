# Required checks. Every job here runs offline after dependency bootstrap.
# Any job needing network at run time belongs in weekly.yml, labeled as such.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: format, lint, types, imports, prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src/
      - run: uv run lint-imports
      - run: uv run python tools/mdlint.py .

  canary:
    name: private-corpus canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # The canary is never committed. It is supplied here as a repository
      # secret and the committed digest proves the right string was used.
      # A missing secret fails this job by design: a canary check that
      # silently skips is worse than no check at all.
      # GitHub does not expose repository secrets to a pull request opened by
      # Dependabot, so the canary would arrive empty and this job would fail on
      # every dependency bump. The scan is skipped there and nowhere else.
      #
      # The job itself always runs and always reports, because it is a required
      # status check: a skipped job leaves that check unreported, and a required
      # check that never reports blocks the pull request forever.
      #
      # The condition names the actor rather than testing whether the secret is
      # empty. An empty secret in any other context must still fail. A control
      # that disables itself the moment its input goes missing is not a control.
      - name: Scan tree for private-corpus canary
        if: github.actor != 'dependabot[bot]'
        env:
          MINTMARK_CANARY: ${{ secrets.MINTMARK_CANARY }}
        run: uv run python tools/canary.py .
      - name: Record why the scan was skipped
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Skipped: repository secrets are not available to Dependabot," >> "$GITHUB_STEP_SUMMARY"
          echo "so the canary cannot be supplied here. This branch changes only" >> "$GITHUB_STEP_SUMMARY"
          echo "the lockfile and workflow pins, and the tree is scanned on the" >> "$GITHUB_STEP_SUMMARY"
          echo "push to main that follows the merge." >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the determinism claim covers. Widening this
        # matrix widens the claim, so it changes only by an explicit decision.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -ra
