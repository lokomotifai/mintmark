# Required checks. Every job here runs offline after dependency bootstrap.
# Any job needing network at run time belongs in weekly.yml, labeled as such.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: format, lint, types, imports, prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src/
      - run: uv run lint-imports
      - run: uv run python tools/mdlint.py .

  canary:
    name: private-corpus canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked --python 3.12
      # The canary is never committed. It is supplied here as a repository
      # secret and the committed digest proves the right string was used.
      # A missing secret fails this job by design: a canary check that
      # silently skips is worse than no check at all.
      # Pull-request code never receives the repository canary. The real scan
      # runs only after reviewed code reaches main; PRs exercise the scanner with
      # a public fixture so this required job still reports a meaningful result.
      - name: Scan tree for private-corpus canary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MINTMARK_CANARY: ${{ secrets.MINTMARK_CANARY }}
        run: uv run python tools/canary.py .
      - name: Exercise the canary scanner without repository secrets
        if: github.event_name == 'pull_request'
        run: uv run pytest tests/unit/test_canary.py
      - name: Record the pull-request trust boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "Repository canary withheld from pull-request code." >> "$GITHUB_STEP_SUMMARY"
          echo "The scanner's public-fixture tests passed; the private canary" >> "$GITHUB_STEP_SUMMARY"
          echo "scan runs on the reviewed push to main." >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: tests on ${{ matrix.os }}, CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the determinism claim covers. Widening this
        # matrix widens the claim, so it changes only by an explicit decision.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        # Every interpreter the package installs on runs the same suite, golden
        # bytes included. The claim recorded in manifests still names CPython
        # 3.12; the other minors are observed here, on the same three platforms.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -ra
