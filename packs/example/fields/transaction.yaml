schema_version: 1
type_name: transaction
id_prefix: TXN
order: 2
fields:
  - name: txn_id
    type: str
    generator: seq_id
    pii_label: none
  - name: customer_id
    type: ref
    generator: seq_id
    ref:
      parent: customer
      counts: [1, 2, 3]
      weights: ["0.55", "0.30", "0.15"]
    pii_label: none
  - name: ts
    type: datetime
    generator: datetime_window
    pii_label: none
  - name: channel
    type: enum
    generator: enum_weighted
    params:
      values: [mobil, internet, pos, atm, sube]
      weights: ["0.52", "0.18", "0.15", "0.10", "0.05"]
    pii_label: none
  - name: amount_kurus
    type: int
    generator: int_lognormal_table:txn_amounts
    pii_label: none
  - name: counterparty_iban
    type: str
    generator: identifier:IBAN
    nullable: true
    null_rate: "0.35"
    pii_label: IBAN
  - name: description
    type: doc
    generator: grammar:txn_descriptions
    pii_label: none
