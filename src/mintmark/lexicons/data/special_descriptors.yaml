name: special_descriptors
source_note: 'Curated neutral-register descriptors for the labels a document template can inject.
  Invented; no source register. Special-category entries stay at category granularity: a class
  of thing, never a clinical detail, never an accusation, never attached to a real organization
  or a real public figure. Reviewed by hand rather than generated, because the provenance of every
  special-category surface has to be traceable to a file a person signed off.'
labels:
  HEALTH:
    note: Condition classes at category granularity. Never a diagnosis, a treatment, a medication,
      or a prognosis.
    values:
    - kronik rahatsızlık
    - geçici iş göremezlik
    - engel durumu beyanı
    - sağlık durumu beyanı
    - mesleki sağlık kısıtı
    - hareket kısıtlılığı beyanı
    - görme desteği ihtiyacı
    - işitme desteği ihtiyacı
    - alerji durumu beyanı
    - solunum hassasiyeti beyanı
    - kas iskelet kısıtı beyanı
    - süreli sağlık kısıtı
    - kalıcı sağlık kısıtı
    - bulaşıcı olmayan rahatsızlık sınıfı
  RELIGION:
    note: Observance and accommodation, not belief content.
    values:
    - dini bayram izni
    - inanç gereği izin talebi
    - ibadet saati düzenlemesi
    - dini gün izni
    - oruç dönemi mesai talebi
    - cenaze töreni izni
    - ibadethane ziyareti izni
    - dini nikah kaydı
    - beslenme tercihi beyanı
    - dini tatil talebi
    - inanç temelli mazeret bildirimi
    - ibadet alanı talebi
  ETHNICITY:
    note: Declared ethnic or cultural origin only, as a form would record it.
    values:
    - etnik köken beyanı
    - soy kökeni beyanı
    - kültürel köken beyanı
    - etnik kimlik beyanı
    - azınlık grubu aidiyeti beyanı
    - etnik topluluk aidiyeti
    - aile kökeni bölgesi beyanı
    - köken bilgisi formu
  POLITICAL:
    note: Fictional parties and civic bodies. No real party is ever named.
    values:
    - Yurttaş Hareketi
    - Ortak Gelecek Partisi
    - Dayanışma Girişimi
    - Kent Konseyi üyeliği
    - Yerel Meclis adaylığı
    - Şehir Platformu
    - Semt Meclisi üyeliği
    - Mahalle Girişimi kaydı
    - Ortak Zemin Derneği üyeliği
    - Kent Gönüllüleri kaydı
    - Yerel Kalkınma Platformu üyeliği
    - Sivil Katılım Ağı kaydı
  SEXUAL_LIFE:
    note: Form-level references only. Never narrative, never detail.
    values:
    - cinsel yaşam verisi beyanı
    - cinsel yönelim beyanı
    - mahrem ilişki bilgisi formu
    - cinsel yaşam mahremiyet talebi
    - cinsel yaşama ilişkin veri düzeltme talebi
    - mahrem partner bilgisi beyanı
    - cinsel yaşama ilişkin erişim kısıtı
    - cinsel yaşam verisi silme talebi
  CRIMINAL:
    note: Check categories, never findings. 'A record was requested' is a process step; 'a record
      exists' would be an accusation about a person, and this project does not make those even
      about invented ones.
    values:
    - adli sicil kaydı sorgusu
    - referans kontrolü
    - güvenlik soruşturması
    - sicil belgesi talebi
    - arşiv kaydı sorgulaması
    - sicil belgesi ibrazı
    - arşiv araştırması talebi
    - kayıt sorgulama formu
    - belge yenileme sorgusu
    - sicil doğrulama talebi
    - kayıt teyidi istemi
    - belge geçerlilik sorgusu
  BIOMETRIC_REF:
    note: References to biometric systems, not to biometric data itself.
    values:
    - parmak izi ile mesai kaydı
    - yüz tanıma ile giriş
    - biyometrik turnike kaydı
    - avuç içi okuyucu kaydı
    - parmak izi doğrulama hatası
    - biyometrik kayıt güncellemesi
    - kart yerine parmak izi tercihi
    - biyometrik veri silme talebi
    - yüz tanıma kaydı yenileme
    - avuç içi kaydı iptali
    - biyometrik sistem devre dışı talebi
    - parmak izi kaydı silme istemi
  UNION:
    note: Fictional unions. No real union is ever named.
    values:
    - Dayanışma Sendikası
    - Birlik İş Sendikası
    - Emek Sendikası
    - Ortak Güç Sendikası
    - Meridyen İşçi Sendikası
    - Anka Çalışanlar Sendikası
    - Meridyen Büro Sendikası
    - Toros Hizmet Sendikası
    - Kıyı İşçileri Sendikası
    - Yeşil Yaka Sendikası
    - Ortak Emek Birliği
    - Pusula Çalışanlar Sendikası
  PERSON:
    note: Counterparty and third-party names for document surfaces. Composed from the same common
      Turkish name pools the structured fields draw from, rather than listed, because a fixed list
      of twelve names is a vocabulary an evaluation set can be passed by memorizing.
    compose: [given_names_tr, surnames_tr]
  ORG:
    note: Fictional organizations on the place-and-nature pattern the family uses. Every entry
      passes the real-institution denylist scan.
    values:
