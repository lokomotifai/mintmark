schema_version: 1
type_name: card
id_prefix: CARD
order: 3
fields:
  - {name: card_id, type: str, generator: seq_id, pii_label: none}
  - name: account_id
    type: ref
    generator: seq_id
    ref: {parent: account, counts: [0, 1, 2], weights: ["0.40", "0.40", "0.20"]}
    pii_label: none
  - {name: pan_masked, type: str, generator: "identifier:PAN", pii_label: PAN}
  - name: kind
    type: enum
    generator: enum_weighted
    params: {values: [debit, credit], weights: ["0.65", "0.35"]}
    pii_label: none
